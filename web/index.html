  <script>
    window.startMarathiVoiceSearch = () => new Promise((resolve) => {
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) { resolve(null); return; }
      const recognition = new Recognition();
      let finished = false;
      const finish = (value) => {
        if (finished) return;
        finished = true;
        resolve(value || null);
      };
      recognition.lang = 'mr-IN';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.onresult = (event) => finish(event.results?.[0]?.[0]?.transcript);
      recognition.onerror = () => finish(null);
      recognition.onend = () => finish(null);
      recognition.start();
    });

    let lastShareScrollY = 0;
    window.addEventListener('scroll', () => {
      const button = document.getElementById('whatsapp-share');
      const current = window.scrollY;
      button?.classList.toggle('share-hidden', current > lastShareScrollY && current > 120);
      lastShareScrollY = current;
    }, { passive: true });

    // Chrome only exposes its native install prompt once. Keep it until the
    // Flutter UI's "Install App" button asks to display it.
    let voterFinderInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      voterFinderInstallPrompt = event;
    });
    window.addEventListener('appinstalled', () => {
      voterFinderInstallPrompt = null;
    });
    window.installVoterFinder = async () => {
      if (!voterFinderInstallPrompt) return false;
      voterFinderInstallPrompt.prompt();
      const choice = await voterFinderInstallPrompt.userChoice;
      voterFinderInstallPrompt = null;
      return choice.outcome === 'accepted';
    };
    window.isVoterFinderStandalone = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    const loadShareImage = (src) => new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = src;
    });
    const canvasBlob = (canvas) => new Promise((resolve, reject) =>
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('PNG failed')), 'image/png')
    );
    const drawCover = (ctx, image, x, y, width, height) => {
      const scale = Math.max(width / image.width, height / image.height);
      const sourceWidth = width / scale;
      const sourceHeight = height / scale;
      ctx.drawImage(
        image,
        (image.width - sourceWidth) / 2,
        (image.height - sourceHeight) / 2,
        sourceWidth,
        sourceHeight,
        x,
        y,
        width,
        height,
      );
    };
    const drawWrappedText = (ctx, text, x, y, maxWidth, lineHeight) => {
      const words = String(text || '').split(/\s+/).filter(Boolean);
      let line = '';
      let cursor = y;
      for (const word of words) {
        const candidate = line ? `${line} ${word}` : word;
        if (line && ctx.measureText(candidate).width > maxWidth) {
          ctx.fillText(line, x, cursor);
          line = word;
          cursor += lineHeight;
        } else {
          line = candidate;
        }
      }
      if (line) ctx.fillText(line, x, cursor);
      return cursor + lineHeight;
    };
    const createVoterCardFile = async (
      name, relationLabel, relationName, village, serial, part, epic,
      house, age, gender, page,
    ) => {
        const canvas = document.createElement('canvas');
        canvas.width = 1080;
        canvas.height = 1350;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f7f8fa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const banner = await loadShareImage('/share/dhairysheel-mohite-patil.jpg');
        drawCover(ctx, banner, 0, 0, 1080, 485);
        const fade = ctx.createLinearGradient(0, 340, 0, 500);
        fade.addColorStop(0, 'rgba(8,42,27,0)');
        fade.addColorStop(1, 'rgba(8,42,27,.72)');
        ctx.fillStyle = fade;
        ctx.fillRect(0, 330, 1080, 170);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 34px "Noto Sans Devanagari", sans-serif';
        ctx.fillText('माढा लोकसभा मतदारसंघ', 54, 456);

        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#dde3e8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(42, 520, 996, 760, 34);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#c96a24';
        ctx.font = '800 28px "Noto Sans Devanagari", sans-serif';
        ctx.fillText('मतदार माहिती', 90, 590);
        ctx.fillStyle = '#102b45';
        ctx.font = '900 48px "Noto Sans Devanagari", sans-serif';
        let y = drawWrappedText(ctx, name, 90, 660, 900, 62) + 12;

        const rows = [
          [relationLabel, relationName], ['गाव', village],
          ['अनुक्रमांक', serial], ['भाग / बूथ क्रमांक', part],
          ['मतदार ओळखपत्र', epic], ['घर क्रमांक', house],
          ['वय', age], ['लिंग', gender], ['PDF पान', page],
        ].filter((row) => row[1]);
        ctx.font = '700 28px "Noto Sans Devanagari", sans-serif';
        for (const [label, value] of rows) {
          if (y > 1190) break;
          ctx.fillStyle = '#607181';
          ctx.fillText(`${label}:`, 90, y);
          ctx.fillStyle = '#102b45';
          y = drawWrappedText(ctx, value, 390, y, 570, 39) + 12;
        }
        ctx.fillStyle = '#c96a24';
        ctx.font = '700 23px "Noto Sans Devanagari", sans-serif';
        ctx.fillText('independent-voter.madhaloksabha.workers.dev', 90, 1240);

        const blob = await canvasBlob(canvas);
        const safeName = String(name || 'voter').replace(/[^\p{L}\p{N}]+/gu, '-');
        const file = new File([blob], `${safeName}-मतदार-माहिती.png`, {type: 'image/png'});
        const text = `मतदार माहिती\nनाव: ${name}\n${village ? `गाव: ${village}\n` : ''}` +
          `https://independent-voter.madhaloksabha.workers.dev/`;
        return {file, text};
    };

    window.shareVoterCard = async (
      name, relationLabel, relationName, village, serial, part, epic,
      house, age, gender, page,
    ) => {
      try {
        const {file, text} = await createVoterCardFile(
          name, relationLabel, relationName, village, serial, part, epic,
          house, age, gender, page,
        );
        if (navigator.share && navigator.canShare && navigator.canShare({files: [file]})) {
          await navigator.share({title: 'मतदार माहिती', text, files: [file]});
          return true;
        }

        const download = document.createElement('a');
        download.href = URL.createObjectURL(file);
        download.download = file.name;
        download.click();
        setTimeout(() => URL.revokeObjectURL(download.href), 3000);
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
        return true;
      } catch (error) {
        if (error && error.name === 'AbortError') return true;
        console.error('Voter card sharing failed', error);
        return false;
      }
    };

    window.shareVoterCards = async (votersJson) => {
      try {
        const voters = JSON.parse(votersJson);
        if (!Array.isArray(voters) || !voters.length || voters.length > 10) return false;
        const cards = [];
        for (const voter of voters) {
          cards.push(await createVoterCardFile(
            voter.name, voter.relationLabel, voter.relationName, voter.village,
            voter.serial, voter.part, voter.epic, voter.house, voter.age,
            voter.gender, voter.page,
          ));
        }
        const files = cards.map((card) => card.file);
        const text = `निवडलेल्या ${files.length} मतदारांची माहिती\n` +
          voters.map((voter, index) => `${index + 1}. ${voter.name}`).join('\n') +
          '\nhttps://independent-voter.madhaloksabha.workers.dev/';
        if (navigator.share && navigator.canShare && navigator.canShare({files})) {
          await navigator.share({title: 'निवडलेल्या मतदारांची माहिती', text, files});
          return true;
        }

        // Desktop browsers commonly cannot attach multiple files to WhatsApp.
        // Download each card separately, then open one WhatsApp text message.
        for (const file of files) {
          const download = document.createElement('a');
          download.href = URL.createObjectURL(file);
          download.download = file.name;
          download.click();
          setTimeout(() => URL.revokeObjectURL(download.href), 5000);
          await new Promise((resolve) => setTimeout(resolve, 120));
        }
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
        return true;
      } catch (error) {
        if (error && error.name === 'AbortError') return true;
        console.error('Multiple voter card sharing failed', error);
        return false;
      }
    };

    window.downloadDuplicateVoterReport = async (title, basis, verifiedAt, groupsJson) => {
      try {
        const groups = JSON.parse(groupsJson);
        if (!Array.isArray(groups) || !groups.length) return false;
        const escapeHtml = (input) => String(input ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
        const value = (input) => escapeHtml(String(input || '').trim() || '—');
        const verification = {
          confirmed: 'अत्यंत मजबूत जुळणी — मूळ नोंद तपासा',
          strong_match: 'मजबूत जुळणी — प्रत्यक्ष पडताळणी करा',
          manual_review: 'प्रत्यक्ष पडताळणी आवश्यक',
        };
        const relationType = {
          father: 'वडील', husband: 'पती', mother: 'आई', guardian: 'पालक',
        };
        const recordCount = groups.reduce((sum, group) => sum + (group.records || []).length, 0);
        const villages = [...new Set(groups.flatMap((group) =>
          (group.records || []).map((record) => String(record.village || '').trim()).filter(Boolean)
        ))].sort((a, b) => a.localeCompare(b, 'mr'));
        const generatedAt = new Intl.DateTimeFormat('mr-IN', {
          dateStyle: 'long', timeStyle: 'short', timeZone: 'Asia/Kolkata',
        }).format(new Date());
        const groupHtml = groups.map((group, groupIndex) => {
          const rows = (group.records || []).map((voter, voterIndex) => `
            <tr>
              <td class="number">${voterIndex + 1}</td>
              <td><strong>${value(voter.name)}</strong></td>
              <td>${value(relationType[voter.relationType] || 'नातेवाईक')} — ${value(voter.relationName)}</td>
              <td>${value(voter.village)}</td>
              <td>${value(voter.part)}</td>
              <td>${value(voter.serial)}</td>
              <td>${value(voter.epic)}</td>
              <td>${value(voter.house)}</td>
              <td>${value(voter.age)}</td>
              <td>${value(voter.gender)}</td>
              <td>${value(voter.pdfName)}<br>पान ${value(voter.page)}</td>
            </tr>`).join('');
          return `<section class="group">
            <div class="group-heading">
              <div><span class="group-number">गट ${groupIndex + 1}</span><h2>${value(group.label)}</h2></div>
              <span class="status">${value(verification[group.verification] || verification.manual_review)}</span>
            </div>
            ${group.relationLabel ? `<p class="relative"><strong>समान नातेवाईकाचे नाव:</strong> ${value(group.relationLabel)}</p>` : ''}
            <p class="count">या गटातील नोंदी: ${(group.records || []).length}</p>
            <div class="table-wrap"><table>
              <thead><tr><th>क्र.</th><th>मतदाराचे पूर्ण नाव</th><th>नातेवाईक</th><th>गाव</th><th>भाग</th><th>अनु.</th><th>EPIC</th><th>घर</th><th>वय</th><th>लिंग</th><th>मूळ स्रोत</th></tr></thead>
              <tbody>${rows}</tbody>
            </table></div>
          </section>`;
        }).join('');
        const documentHtml = `<!doctype html><html lang="mr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1"><title>${value(title)}</title>
          <style>
            @page{size:A4 landscape;margin:12mm}*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#102a43;font-family:"Noto Sans Devanagari","Nirmala UI",Arial,sans-serif;line-height:1.45}.report{max-width:1400px;margin:auto;background:#fff;min-height:100vh}.cover{padding:34px 38px;background:linear-gradient(135deg,#081f33,#102a43);color:#fff;border-bottom:6px solid #c96a24}.eyebrow{margin:0 0 8px;color:#d5ae5d;font-weight:800}.cover h1{margin:0;font-size:30px;line-height:1.25}.basis{margin:18px 0 0;padding:14px 16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 38px}.metric{padding:15px;border:1px solid #dde3e8;border-radius:12px;background:#f7f8fa}.metric strong{display:block;font-size:22px;color:#c96a24}.notice{margin:0 38px 22px;padding:16px 18px;border-left:5px solid #c96a24;background:#fff4ec}.content{padding:0 38px 40px}.group{margin:0 0 22px;padding:18px;border:1px solid #dde3e8;border-radius:14px;break-inside:avoid;page-break-inside:avoid}.group-heading{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.group-heading h2{margin:3px 0 0;font-size:21px}.group-number{font-size:12px;font-weight:800;color:#c96a24;text-transform:uppercase}.status{padding:7px 10px;border-radius:999px;background:#fff4ec;color:#8b451b;font-size:12px;font-weight:800}.relative,.count{margin:8px 0;color:#68747e}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#102a43;color:#fff;text-align:left}th,td{padding:8px 7px;border:1px solid #dde3e8;vertical-align:top}.number{text-align:center;font-weight:800}.footer{padding:20px 38px;background:#081f33;color:#fff}.footer p{margin:4px 0}.print{position:fixed;right:18px;bottom:18px;border:0;border-radius:999px;background:#c96a24;color:#fff;padding:12px 18px;font-weight:800;box-shadow:0 8px 24px #0003;cursor:pointer}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.cover,.summary,.content,.footer{padding-left:18px;padding-right:18px}.cover h1{font-size:24px}.group-heading{display:block}.status{display:inline-block;margin-top:10px}}@media print{body{background:#fff}.report{max-width:none}.print{display:none}.group{border-color:#aaa}}
          </style></head><body><main class="report">
          <header class="cover"><p class="eyebrow">माढा लोकसभा मतदारसंघ • प्रशासकीय तपासणी</p><h1>${value(title)}</h1><p class="basis"><strong>अहवालाचा आधार:</strong> ${value(basis)}</p></header>
          <section class="summary"><div class="metric"><strong>${groups.length}</strong>समान नोंदींचे गट</div><div class="metric"><strong>${recordCount}</strong>एकूण मतदार नोंदी</div><div class="metric"><strong>${villages.length}</strong>समाविष्ट गावे</div><div class="metric"><strong>${value(generatedAt)}</strong>अहवाल तयार केला</div></section>
          <aside class="notice"><strong>महत्त्वाची सूचना:</strong> संपूर्ण नाव किंवा इतर तपशील समान आढळणे म्हणजे मतदार निश्चितपणे दुबार आहे असे नाही. अंतिम निर्णयापूर्वी नातेवाईकाचे नाव, EPIC क्रमांक, वय, घर क्रमांक आणि मूळ PDF नोंद तपासावी. या अहवालामुळे कोणतीही नोंद आपोआप वगळली किंवा हटवली जात नाही.</aside>
          <div class="content"><p><strong>समाविष्ट गावे:</strong> ${villages.map(value).join(', ') || '—'}</p>${verifiedAt ? `<p><strong>नवीनतम index पडताळणी:</strong> ${value(verifiedAt)}</p>` : ''}${groupHtml}</div>
          <footer class="footer"><p><strong>पुढील कार्यवाही:</strong> प्रत्येक गटातील EPIC, नातेवाईकाचे नाव, वय, घर क्रमांक आणि मूळ PDF पान यांची प्रत्यक्ष तुलना करा.</p><p>स्रोत: नवीनतम active आणि ready मतदार PDF index • independent-voter.madhaloksabha.workers.dev</p></footer>
          </main><button class="print" onclick="window.print()">PDF म्हणून जतन / Print</button></body></html>`;
        const blob = new Blob([documentHtml], {type: 'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = `duplicate-voter-report-${new Date().toISOString().slice(0, 10)}.html`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return true;
      } catch (error) {
        console.error('Duplicate voter report download failed', error);
        return false;
      }
    };
